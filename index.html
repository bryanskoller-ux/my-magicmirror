<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mirror Dashboard</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 40px;
            padding: 0;
            overflow: hidden;
            user-select: none;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            height: calc(100vh - 80px);
            position: relative;
        }
        .top-left { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; z-index: 2; }
        .top-right { grid-column: 2; grid-row: 1; align-self: start; justify-self: end; text-align: right; z-index: 2; }
        .bottom-left { grid-column: 1; grid-row: 2; align-self: end; justify-self: start; z-index: 2; }
        .bottom-right { grid-column: 2; grid-row: 2; align-self: end; justify-self: end; text-align: right; z-index: 2; }
        .bottom-center { grid-column: 1 / span 2; grid-row: 3; align-self: end; justify-self: center; text-align: center; margin-top: 20px; z-index: 2; }

        /* Dead Center Container für die Kugel */
        .center-globe-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 360px;
            height: 360px;
            z-index: 1;
            opacity: 0.25; /* Perfekt ausbalanciert für Spiegelglas */
            pointer-events: none;
        }

        /* Clock Styling */
        #time { font-size: 4.5rem; font-weight: 300; margin-bottom: 5px; }
        #date { font-size: 1.5rem; color: #aaa; font-weight: 400; }

        /* Weather Styling */
        .weather-main { display: flex; align-items: center; justify-content: flex-end; gap: 15px; }
        #weather-icon { font-size: 3.5rem; }
        #weather-temp { font-size: 3.5rem; font-weight: 300; }
        #weather-desc { font-size: 1.2rem; color: #aaa; margin-top: 0px; margin-bottom: 15px; }
        .forecast-row { font-size: 1.1rem; margin-bottom: 4px; color: #eee; }

        /* Transit Styling */
        .transit-header { font-size: 1.3rem; letter-spacing: 1px; color: #999; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .transit-table { border-collapse: collapse; font-size: 1.2rem; }
        .top-right .transit-table { margin-left: auto; }
        .transit-row { border-bottom: 1px solid #222; }
        .transit-row td { padding: 8px 15px; }
        .bottom-left .transit-row td:first-child { padding-left: 0; }
        .bottom-right .transit-row td:last-child { padding-right: 0; text-align: right; }
        .line-badge { background: #333; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .time-cell { color: #28a745; font-weight: 500; }
        .delay-text { color: #dc3545; font-size: 0.9rem; margin-left: 5px; }

        /* Quote Styling */
        #quote-text { font-size: 1.1rem; color: #666; max-width: 600px; font-style: italic; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOP LEFT: CLOCK -->
        <div class="top-left">
            <div id="time">00:00</div>
            <div id="date">Donnerstag, 1. Januar</div>
        </div>

        <!-- TOP RIGHT: WEATHER -->
        <div class="top-right">
            <div class="weather-main">
                <span id="weather-icon"></span>
                <span id="weather-temp">--°C</span>
            </div>
            <div id="weather-desc">Lade Wetter...</div>
            <div id="forecast-box"></div>
        </div>

        <!-- CENTER: NATIVE 3D DAY/NIGHT GLOBE CANVAS -->
        <div class="center-globe-container">
            <canvas id="globeCanvas" width="360" height="360"></canvas>
        </div>

        <!-- BOTTOM LEFT: TRANSIT BOARD -->
        <div class="bottom-left">
            <div class="transit-header">Abfahrten Richtung Davos Platz</div>
            <table class="transit-table" id="transit-board-platz"></table>
        </div>

        <!-- BOTTOM RIGHT: TRANSIT BOARD -->
        <div class="bottom-right">
            <div class="transit-header">Abfahrten Richtung Bahnhof Dorf</div>
            <table class="transit-table" id="transit-board-dorf"></table>
        </div>

        <!-- BOTTOM CENTER: MINIMALIST QUOTE -->
        <div class="bottom-center">
            <div id="quote-text">"Lade Inspiration..."</div>
        </div>
    </div>

    <script>
        // 1. Live Clock System
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: false };
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            
            document.getElementById('time').innerText = now.toLocaleTimeString('de-CH', timeOptions);
            document.getElementById('date').innerText = now.toLocaleDateString('de-CH', dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. Free Davos Weather (5-Day Forecast)
        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=46.8066&longitude=9.8427&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBerlin');
                const data = await res.json();
                
                const weatherMap = {
                    0: 'Klarer Himmel', 1: 'Vorwiegend klar', 2: 'Teils bewölkt', 3: 'Bewölkt',
                    45: 'Nebel', 48: 'Reifnebel', 51: 'Leichter Nieselregen', 53: 'Nieselregen',
                    61: 'Leichter Regen', 63: 'Regen', 71: 'Leichter Schneefall', 73: 'Schneefall',
                    75: 'Starker Schneefall', 80: 'Regenschauer', 95: 'Gewitter'
                };

                function getIcon(code) {
                    if (code === 0 || code === 1) return '☀️';
                    if (code === 2 || code === 3) return '☁️';
                    if ([45, 48].includes(code)) return '🌫️';
                    if ([51, 53, 61, 63, 80].includes(code)) return '🌧️';
                    if ([71, 73, 75].includes(code)) return '❄️';
                    if (code === 95) return '⛈️';
                    return '🌤️';
                }

                document.getElementById('weather-icon').innerText = getIcon(data.current.weather_code);
                document.getElementById('weather-temp').innerText = Math.round(data.current.temperature_2m) + '°C';
                document.getElementById('weather-desc').innerText = weatherMap[data.current.weather_code] || 'Heiter';

                let forecastHTML = '';
                for(let i=1; i<=5; i++) {
                    const dayName = new Date(data.daily.time[i]).toLocaleDateString('de-CH', { weekday: 'short' });
                    const max = Math.round(data.daily.temperature_2m_max[i]);
                    const min = Math.round(data.daily.temperature_2m_min[i]);
                    const dailyIcon = getIcon(data.daily.weather_code[i]);
                    forecastHTML += `<div class="forecast-row"><strong>${dayName}:</strong> ${dailyIcon} ${max}° / ${min}°C</div>`;
                }
                document.getElementById('forecast-box').innerHTML = forecastHTML;
            } catch (e) { console.error("Weather error", e); }
        }
        setInterval(fetchWeather, 600000);
        fetchWeather();

        // 3. Dual Live Swiss Transport Departures
        async function fetchTransit() {
            try {
                const res = await fetch('https://transport.opendata.ch/v1/stationboard?station=Davos+Dorf,+Dischmastrasse&limit=30');
                const data = await res.json();
                
                let platzHTML = '';
                let dorfHTML = '';
                let platzCount = 0;
                let dorfCount = 0;

                if (data.stationboard && data.stationboard.length > 0) {
                    data.stationboard.forEach(dep => {
                        const destination = dep.to.toLowerCase().trim();
                        const depTime = new Date(dep.stop.departure);
                        const formattedTime = depTime.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit' });
                        
                        let delayHTML = '';
                        if (dep.stop.prognosis && dep.stop.prognosis.delay) {
                            delayHTML = `<span class="delay-text">+${dep.stop.prognosis.delay}'</span>`;
                        }

                        const rowTemplate = `
                            <tr class="transit-row">
                                <td><span class="line-badge">${dep.number}</span></td>
                                <td style="min-width: 160px;">${dep.to}</td>
                                <td class="time-cell">${formattedTime}${delayHTML}</td>
                            </tr>
                        `;

                        if (destination.startsWith('davos') && !destination.includes('dorf') && platzCount < 4) {
                            platzHTML += rowTemplate;
                            platzCount++;
                        }
                        
                        if (destination.includes('davos dorf') && dorfCount < 4) {
                            dorfHTML += rowTemplate;
                            dorfCount++;
                        }
                    });
                }
                
                document.getElementById('transit-board-platz').innerHTML = platzHTML || '<tr><td style="color:#aaa;">Keine Abfahrten</td></tr>';
                document.getElementById('transit-board-dorf').innerHTML = dorfHTML || '<tr><td style="color:#aaa;">Keine Abfahrten</td></tr>';
                
            } catch (e) { 
                console.error("Transit error", e); 
                const errorRow = '<tr><td style="color:#dc3545;">Verbindungsfehler</td></tr>';
                document.getElementById('transit-board-platz').innerHTML = errorRow;
                document.getElementById('transit-board-dorf').innerHTML = errorRow;
            }
        }
        setInterval(fetchTransit, 30000);
        fetchTransit();

        // 4. Rotating Quotes
        const quotes = [
            '"Die beste Zeit für einen Neuanfang ist jetzt."',
            '"Fokus liegt nicht darin, Dinge zu tun, sondern das Wesentliche zu tun."',
            '"Es kommt nicht darauf an, wie langsam du gehst, solange du nicht stehen bleibst."',
            '"Einfachheit ist die höchste Stufe der Vollendung."',
            '"Qualität bedeutet, etwas ordentlich zu erledigen, auch wenn niemand hinsieht."',
            '"Der Weg ist das Ziel."'
        ];
        function updateQuote() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote-text').innerText = randomQuote;
        }
        setInterval(updateQuote, 7200000);
        updateQuote();

        // 5. Native High-Performance Matrix Globe (100% Local & Failproof)
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const r = cx - 10;

        // Vektor-Koordinaten-Cluster für die vereinfachten Kontinente (Breitengrad, Längengrad)
        const landMasses = [
            // Europa & Asien
            { lat: 55, lon: 10, w: 50, h: 25 }, { lat: 60, lon: 60, w: 70, h: 20 }, { lat: 35, lon: 105, w: 45, h: 25 },
            // Afrika
            { lat: 10, lon: 20, w: 35, h: 40 }, { lat: 25, lon: 25, w: 40, h: 15 },
            // Nordamerika
            { lat: 45, lon: -100, w: 55, h: 30 }, { lat: 65, lon: -110, w: 40, h: 15 },
            // Südamerika
            { lat: -15, lon: -60, w: 25, h: 45 },
            // Australien
            { lat: -25, lon: 135, w: 30, h: 20 }
        ];

        function drawGlobe() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Basis-Silhouette der Erde zeichnen
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a0a0a';
            ctx.fill();
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Berechne die aktuelle Erdrotation basierend auf der UTC-Uhrzeit (Sonnen-Perspektive)
            const now = new Date();
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60;
            // 0 Uhr UTC bedeutet, dass Längengrad 180 auf der Rückseite liegt.
            const rotationAngle = (utcHours * 15) * (Math.PI / 180) - Math.PI;

            // 2. Kontinente auf die Kugel projizieren
            ctx.fillStyle = '#555';
            landMasses.forEach(m => {
                for (let la = m.lat - m.h/2; la <= m.lat + m.h/2; la += 3) {
                    for (let lo = m.lon - m.w/2; lo <= m.lon + m.w/2; lo += 3) {
                        
                        // Rotationsmatrix auf den Längengrad anwenden
                        const radLat = la * (Math.PI / 180);
                        const radLon = lo * (Math.PI / 180) + rotationAngle;

                        // 3D zu 2D Orthografische Transformation
                        const x = r * Math.cos(radLat) * Math.sin(radLon);
                        const y = -r * Math.sin(radLat);
                        const z = r * Math.cos(radLat) * Math.cos(radLon);

                        // Wenn z > 0, befindet sich der Punkt auf der der Sonne zugewandten Seite (sichtbar)
                        if (z > 0) {
                            ctx.beginPath();
                            ctx.arc(cx + x, cy + y, 1.8, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }
                }
            });

            // 3. Sonnenlicht-Vignette (Mitte taghell, Ränder gleiten perfekt in den Schatten der Nacht)
            const shadowGrad = ctx.createRadialGradient(cx, cy, r * 0.65, cx, cy, r);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0.98)');

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.fillStyle = shadowGrad;
            ctx.fill();
        }

        // Rendert die Kugel flüssig alle 30 Sekunden neu, um der Erddrehung zu folgen
        setInterval(drawGlobe, 30000);
        drawGlobe();
    </script>
</body>
</html>
